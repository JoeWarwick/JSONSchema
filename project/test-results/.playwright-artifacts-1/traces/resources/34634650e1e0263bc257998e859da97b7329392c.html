/* /app/styles/reset.css */
/* Josh Comeau CSS Reset 
 * Source: https://www.joshwcomeau.com/css/custom-css-reset/
 * Description: A modern CSS reset to improve consistency and control over default styles.
 */

/* 1. Use a more-intuitive box-sizing model */
*,
*::before,
*::after {
  box-sizing: border-box;
}
/* 2. Remove default margin */
* {
  margin: 0;
}
body {
  /* 3. Add accessible line-height */
  line-height: 1.5;
  /* 4. Improve text rendering */
  -webkit-font-smoothing: antialiased;
}
/* 5. Improve media defaults */
img,
picture,
video,
canvas,
svg {
  display: block;
  max-width: 100%;
}
/* 6. Inherit fonts for form controls */
input,
button,
textarea,
select {
  font: inherit;
}
/* 7. Avoid text overflows */
p,
h1,
h2,
h3,
h4,
h5,
h6 {
  overflow-wrap: break-word;
}
/* 8. Improve line wrapping */
p {
  text-wrap: pretty;
}
h1,
h2,
h3,
h4,
h5,
h6 {
  text-wrap: balance;
}

/* Custom additions to the original Josh Comeau reset by Dazl */

a {
  text-decoration: none;
  color: inherit;
}

button {
  border: none;
  cursor: pointer;
}


/* /app/styles/global.css */
html {
  font: var(--font-body);
  color: var(--color-neutral-11);
  background-color: var(--color-neutral-1);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}


/* /app/styles/tokens/keyframes.css */
@keyframes fade-in {
  to {
    opacity: 1;
  }
}

@keyframes fade-out {
  to {
    opacity: 0;
  }
}

@keyframes scale-up {
  to {
    transform: scale(1.25);
  }
}

@keyframes scale-down {
  to {
    transform: scale(0.75);
  }
}

@keyframes spin {
  to {
    transform: rotate(1turn);
  }
}

@keyframes blink {
  0%,
  to {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}

@keyframes bounce {
  25% {
    transform: translateY(-20%);
  }
  40% {
    transform: translateY(-3%);
  }
  0%,
  60%,
  to {
    transform: translateY(0);
  }
}


/* /app/styles/tokens/animations.css */
:where(html) {
  --ease: cubic-bezier(0.25, 0, 0.3, 1);
  --ease-in: cubic-bezier(0.7, 0, 1, 1);
  --ease-out: cubic-bezier(0, 0, 0.3, 1);
  --ease-in-out: cubic-bezier(0.5, 0, 0.5, 1);
  --ease-bounce-out: cubic-bezier(0.5, 1.25, 0.75, 1.25);
  --ease-bounce-in: cubic-bezier(0.5, -0.75, 0.75, 1);
  --ease-bounce-in-out: cubic-bezier(0.5, -0.5, 0.1, 1.5);

  --animation-fade-in: fade-in 0.5s var(--ease);
  --animation-fade-out: fade-out 0.5s var(--ease);

  --animation-scale-up: scale-up 0.5s var(--ease);
  --animation-scale-down: scale-down 0.5s var(--ease);

  --animation-spin: spin 2s linear infinite;
  --animation-blink: blink 1s var(--ease-out) infinite;
  --animation-bounce: bounce 2s var(--ease-bounce-in-out) infinite;
}
